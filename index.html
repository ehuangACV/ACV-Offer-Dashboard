<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ACV Offer Dashboard — Component Playground</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Roboto', -apple-system, sans-serif; color: #212121; background: #F5F5F5; }
  #app { height: 100%; }

  /* ===================== Playground chrome ===================== */
  .pg-shell { display: flex; height: 100%; }
  .pg-sidebar { width: 260px; flex-shrink: 0; background: #1C1D1F; color: #fff; overflow: hidden; padding: 16px 0; transition: width .22s ease, padding .22s ease; box-sizing: border-box; }
  .pg-sidebar__inner { width: 260px; height: 100%; overflow-y: auto; }
  .pg-sidebar--collapsed { width: 0; padding-top: 16px; padding-bottom: 16px; }
  .pg-rail-toggle { flex-shrink: 0; width: 14px; align-self: stretch; border: none; background: #E8E9EB; color: #757575; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
  .pg-rail-toggle:hover { background: #F26522; color: #fff; }
  .pg-sidebar__title { font-size: 14px; font-weight: 700; padding: 0 16px 16px; letter-spacing: .3px; border-bottom: 1px solid #333; margin-bottom: 8px; }
  .pg-group { margin-bottom: 12px; }
  .pg-group__title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #9A9CA2; padding: 8px 16px 4px; }
  .pg-nav-item { display: block; width: 100%; text-align: left; padding: 8px 16px; border: none; background: none; color: #D1D3D6; font-size: 13px; cursor: pointer; }
  .pg-nav-item:hover { background: #2A2B2D; color: #fff; }
  .pg-nav-item--active { background: #F26522; color: #fff; font-weight: 500; }
  .pg-nav-item__order { display: inline-block; width: 22px; color: #757575; font-size: 11px; }
  .pg-nav-item--active .pg-nav-item__order { color: rgba(255,255,255,.7); }

  .pg-main { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 32px; }
  .pg-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .pg-header h1 { font-size: 20px; margin: 0; }
  .pg-header__meta { font-size: 12px; color: #757575; }

  .pg-mocks { display: flex; align-items: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .pg-mocks__label { font-size: 12px; color: #757575; font-weight: 500; }
  .pg-mock-btn { border: 1px solid #DCDFE8; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: #004E7D; }
  .pg-mock-btn:hover { background: #F0F8FF; }

  .pg-workspace { display: flex; align-items: flex-start; }
  /* 2026-09-12 按你的要求:背景从纯白改成浅灰(#F0F1F3)——之前预览
     舞台和里面渲染出来的组件(比如 Offer Dashboard 自己就是白底)颜色
     完全一样,窄屏(比如 mobile 375px)时完全看不出组件的边界在哪,
     "白白的一片"。改成浅灰画布之后,不管组件自己是不是白底,都能看清
     它的实际渲染范围,参照你截图里那个同事做的 VDP 预览工具的做法
     (灰色画布 + 组件本身在中间,像一张卡片浮在上面)。 */
  .pg-stage { flex: 1; min-width: 0; background: #F0F1F3; border: 1px solid #E8E9EB; border-radius: 8px; padding: 24px; overflow: auto; }

  /* 2026-08 按你的要求新增:整页组件(比如 Offer Dashboard)右上角
     "Expand to full page" 按钮,方便你做 presentation 时全屏看效果。这
     一整块都是 Playground 自己的外壳 UI,不属于任何 fragment 组件,不会
     改到 OfferDashboard.vue 等真实组件文件。 */
  .pg-main { position: relative; }
  .pg-fullscreen-btn { position: absolute; top: 24px; right: 32px; z-index: 20; display: flex; align-items: center; gap: 6px; border: 1px solid #DCDFE8; background: #fff; border-radius: 6px; padding: 6px 14px; font-size: 13px; color: #004E7D; cursor: pointer; }
  .pg-fullscreen-btn:hover { background: #F0F8FF; }

  .pg-shell--fullscreen .pg-sidebar,
  .pg-shell--fullscreen .pg-rail-toggle--sidebar,
  .pg-shell--fullscreen .pg-header,
  .pg-shell--fullscreen .pg-mocks,
  .pg-shell--fullscreen .pg-notes { display: none; }
  .pg-shell--fullscreen .pg-main { position: fixed; inset: 0; padding: 0; z-index: 1000; background: #fff; overflow: auto; }
  .pg-shell--fullscreen .pg-workspace { height: 100%; align-items: stretch; }
  .pg-shell--fullscreen .pg-stage { height: 100%; border: none; border-radius: 0; padding: 0; }
  /* pg-stage 在全屏时 padding 已经清零(见上面 padding:0 那条),
     Dashboard 自己的 AppHeader 现在会紧贴到真正的屏幕左上角——如果这个
     按钮还留在 top:12/right:12,会正好盖住 AppHeader 右侧的铃铛/头像/
     菜单图标。挪到 AppHeader(58px 高)下方、breadcrumb 那一行右侧的
     空白区域,不会挡住任何真实内容 */
  .pg-shell--fullscreen .pg-fullscreen-btn { top: 66px; right: 16px; }
  /* 2026-08 新增 screenWidth 滑块控件(只在选中 Offer Dashboard 时出现)
     之后,把"全屏时铺满可用宽度"和"用滑块模拟任意屏幕宽度"统一成同一套
     机制,细节(container-type、cqw 换算公式)见下面 .offer-dashboard
     相关规则旁边的注释,这里不重复。 */
  /* 2026-09-13(第二次,撤销)按你的要求给这个框加过 width:fit-content
     +居中+白底+阴影("卡片浮在灰色画布上"的效果),想解决"贴边的方框"
     的问题,但你反馈这样看着反而更乱——已经撤销,恢复成改动前只有
     container-type、不管外观的样子,细节和撤销原因见 notes.md。 */
  .pg-stage__resize-frame { container-type: inline-size; }
  /* 2026-09-13(第三次)你反馈 Mobile view 的高度"没有手机的感觉"——
     实测过 stageFrameHeight/stageFrameStyle 本身没有 bug,真实渲染出来
     的 .pg-stage__resize-frame 高度确实精确是 844px(内部 overflow-y:
     auto 也确实生效,超出 844 的内容会被裁切、靠内部滚动查看),问题是
     纯视觉上的:这个框贴着舞台左上角,没有居中、没有描边/圆角,也没有
     隐藏原生滚动条,看起来就是一块普通的裁切区域,不像一个悬浮在灰色
     画布上的手机屏幕。新增 --device 这个修饰类,只在 Mobile view
     (stageFrameHeight 有值)时生效,不影响 Web view/Auto 模式,也不会
     碰到别的组件(Filter Chip Group 等)——上面(第二次)被你说"更乱"的
     白底+阴影是加在所有组件通用的 .pg-stage__card 上,这次改动范围
     收紧到只有 Mobile view 这一个场景,两者不是同一件事。 */
  .pg-stage__resize-frame--device {
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 16px 40px rgba(0,0,0,.14);
    scrollbar-width: none;
    /* 2026-09-13(第八次,rewind)第四/第七次为了让 Dealership 下拉、
       InformationDialog 的 mobile 弹层贴合这个模拟手机框,分别加过
       contain:layout(第四次)和"拆成两层"(第七次)。第七次上线后你
       反馈"问题更严重了"——Mobile view 点 Manage Offer 还是没反应,
       连 Web view 切换、Screen width 滑块都跟着失灵。排查到根因:那两次
       改动会触发 Vue Teleport 内部一个报错("Cannot read properties of
       null (reading 'nextSibling')"),这个报错一旦抛出会打断 Vue 整个
       应用的响应式渲染循环——不是某一个按钮的问题,是整个页面的交互都被
       卡死了。之前我自己测试时也见过这个报错,但错误地当成"手动同时开了
       两个弹层"这种测试脏状态导致的偶发现象,没当真正的 bug 处理,这是
       我的判断失误。
       决定:整体撤销第四/第七次这两轮"贴合手机框"的实验性改动,回到更早
       (第三次,只有"手机的感觉"这几条圆角/阴影/居中/隐藏滚动条的视觉
       样式,不带 contain:layout)、已经验证过稳定的样子——这个状态下
       Manage Offer/Dealership 下拉等弹层功能本身完全正常(能打开、能
       操作),唯一的代价是纯视觉上的:Playground 预览这些 fixed 定位的
       弹层时会铺满整个桌面浏览器窗口宽度,不会贴合这个 390px 的模拟
       手机框——这只是预览工具本身的视觉小瑕疵,不影响任何真实逻辑,也
       不会导致任何交互失灵,比反复尝试更"聪明"的定位技巧但屡次搞坏整个
       工具划算得多。以后如果要再解决这个视觉瑕疵,需要先在不影响主应用
       稳定性的前提下更谨慎地验证,不能再这样反复直接改。 */
  }
  .pg-stage__resize-frame--device::-webkit-scrollbar { display: none; }
  /* 2026-09-11 Spec Mode 相关样式,细节见 Harness setup() 里那段注释。
     鼠标悬浮预览框用蓝色描边(跟截图参考的那个工具同一个思路,不是抄
     它的具体像素值),点击后的详细面板走这个项目自己已有的色板
     (#0E0E0F/#55575C/#E8E9EB 这些是全项目通用的深色/灰色/描边色,不是
     新配的一套颜色)。 */
  .pg-stage--spec-mode .pg-stage__resize-frame { cursor: crosshair; }
  .pg-spec-hover { position: fixed; z-index: 60; pointer-events: none; border: 1px solid #2196F5; background: rgba(33,150,243,0.08); box-sizing: border-box; }
  .pg-spec-hover__label { position: absolute; top: -22px; left: 0; background: #2196F5; color: #FFFFFF; font-size: 11px; line-height: 18px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-family: 'Roboto', sans-serif; }
  .pg-spec-panel { position: fixed; z-index: 61; width: 300px; max-height: 420px; overflow-y: auto; background: #FFFFFF; border: 1px solid #E8E9EB; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-family: 'Roboto', sans-serif; }
  .pg-spec-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #E8E9EB; }
  .pg-spec-panel__title { font-size: 12px; font-family: 'Menlo', 'Consolas', monospace; color: #0E0E0F; word-break: break-all; }
  .pg-spec-panel__close { border: none; background: none; font-size: 18px; line-height: 1; color: #757575; cursor: pointer; padding: 0 2px; }
  .pg-spec-panel__close:hover { color: #0E0E0F; }
  .pg-spec-panel__body { padding: 8px 12px; }
  .pg-spec-panel__section { font-size: 11px; font-weight: 700; color: #757575; text-transform: uppercase; letter-spacing: .3px; margin: 10px 0 4px; }
  .pg-spec-panel__section:first-child { margin-top: 2px; }
  .pg-spec-panel__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 12px; }
  .pg-spec-panel__row-label { color: #55575C; flex-shrink: 0; }
  .pg-spec-panel__row-value { color: #0E0E0F; text-align: right; word-break: break-word; }
  .pg-spec-panel__foot { padding: 10px 12px; border-top: 1px solid #E8E9EB; }
  .pg-spec-panel__copy { padding: 8px 12px; font-size: 13px; }
  .pg-spec-panel__copy::before { content: none; }
  .pg-no-controls--inline { width: auto; margin: 8px 0 0; }
  /* 2026-08 按你的要求:全屏时右边不应该有空白,Buying/Selling下面那条
     横线(以及搜索框/筛选chip行/表格,它们右边界都是同一个)之前都会在
     content 右边固定留 24px 的padding,导致这些行的右边缘都停在比
     AppHeader(已经是真全屏无边距)更靠左24px的地方,看起来像多出一块
     没用到的空白。这里全屏时把这个固定的右padding去掉,让内容右边界
     和AppHeader一样贴到真正的屏幕右边缘,不再单独处理"这条线"一个元素,
     这样和它同一行/同一右边界的其它内容也会一起对齐,不会顾此失彼。 */
  .pg-shell--fullscreen .offer-dashboard__content { padding-right: 0; }
  .pg-rail-toggle--controls { margin: 0 8px; border-radius: 4px; height: 32px; align-self: center; }
  .pg-controls { width: 300px; flex-shrink: 0; background: #fff; border: 1px solid #E8E9EB; border-radius: 8px; padding: 16px; overflow: hidden; box-sizing: border-box; transition: width .22s ease, padding .22s ease, border-color .22s ease; }
  .pg-controls__inner { width: 268px; }
  .pg-controls--collapsed { width: 0; padding-left: 0; padding-right: 0; border-color: transparent; }
  .pg-controls__title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #545454; text-transform: uppercase; letter-spacing: .3px; }
  .pg-control-field { margin-bottom: 16px; }
  /* 2026-09 按你给的截图重做:label 从"小灰字"改成"深色粗体小标题"
     (对应截图里"Viewport"这种section标题的分量),不再是不起眼的
     附属说明文字。【2026-09-02 更正】你反馈控制面板文字要精简——除了
     .pg-controls__title 这个总标题保留原样,每个控制自己的 label 改成
     Regular(不再是600)、字号从14px缩小2px到12px */
  .pg-control-field label { display: block; font-size: 12px; font-weight: 400; color: #1F2430; margin-bottom: 8px; }
  .pg-control-field select, .pg-control-field input[type=text], .pg-control-field input[type=number] { width: 100%; padding: 9px 12px; border: 1px solid #D8DAE0; border-radius: 8px; font-size: 13px; color: #1F2430; box-sizing: border-box; transition: border-color .15s ease, box-shadow .15s ease; }
  .pg-control-field select:focus, .pg-control-field input[type=text]:focus, .pg-control-field input[type=number]:focus { outline: none; border-color: #6C7BFF; box-shadow: 0 0 0 3px rgba(108,123,255,.15); }
  /* 布尔控件画成 iOS 风格的开关,而不是普通 checkbox */
  .pg-control-field input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #DCDFE8;
    position: relative;
    cursor: pointer;
    outline: none;
    vertical-align: middle;
    transition: background-color .15s ease;
  }
  .pg-control-field input[type=checkbox]::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform .15s ease;
  }
  .pg-control-field input[type=checkbox]:checked { background: #2F5BFF; }
  .pg-control-field input[type=checkbox]:checked::before { transform: translateX(16px); }
  /* 2026-09-02 按你的要求:布尔开关(switcher)本身的label和开关放到同一行
     (label左、开关右),不再是label单独占一行、开关另起一行——只对
     type==='boolean' 的控件生效,通过 Harness 模板里动态加的
     pg-control-field--switch 这个修饰 class 实现,其它类型(select/
     text/number/segmented/range)的控件布局不受影响 */
  .pg-control-field--switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pg-control-field--switch label { margin-bottom: 0; }
  /* 2026-09 按你给的截图重做 reset 这颗按钮:浅灰底、深色粗体字、居中,
     不再是描边橙色小按钮 */
  .pg-control-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; border: 1px solid #E4E6EC; border-radius: 10px; background: #F3F4F6; color: #1F2430; font-size: 14px; font-weight: 700; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
  .pg-control-button::before { content: '↺'; font-size: 15px; font-weight: 400; }
  .pg-control-button:hover { background: #E9EBEF; border-color: #D8DAE0; }
  .pg-control-button:active { background: #DEE1E7; }
  /* 2026-09 新增分段按钮控件(截图里 Viewport 那一排 Desktop/Tablet/
     Mobile 的样式)——一排等宽/自适应的圆角按钮,选中的一个填蓝色实底,
     其余描边灰色。用于 cardVersion 这种"只有几个互斥选项"的控件,
     取代原来不起眼的 <select> 下拉。 */
  .pg-segmented { display: flex; flex-wrap: wrap; gap: 8px; }
  .pg-segmented__btn { display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1 1 auto; padding: 10px 14px; border: 1px solid #D8DAE0; border-radius: 8px; background: #FFFFFF; color: #1F2430; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .pg-segmented__btn:hover { background: #F3F4F6; }
  .pg-segmented__btn--active { background: #2F5BFF; border-color: #2F5BFF; color: #FFFFFF; }
  .pg-segmented__btn--active:hover { background: #2450E6; }
  .pg-control-range { display: flex; align-items: center; gap: 8px; }
  .pg-control-range input[type=range] { flex: 1; min-width: 0; }
  .pg-control-range__value { font-size: 12px; color: #545454; white-space: nowrap; min-width: 44px; text-align: right; }
  .pg-no-controls { color: #9A9CA2; font-size: 13px; width: 300px; flex-shrink: 0; margin-left: 24px; }

  .pg-notes { margin-top: 20px; background: #fff; border: 1px solid #E8E9EB; border-radius: 8px; padding: 4px 16px; }
  .pg-notes summary { cursor: pointer; padding: 10px 0; font-size: 13px; font-weight: 600; color: #545454; }
  .pg-notes pre { white-space: pre-wrap; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12.5px; line-height: 1.6; color: #333; padding-bottom: 12px; }

  /* ===================== Fragment component styles ===================== */
  /* -- AppHeader -- */
  .app-header { position: sticky; top: 0; z-index: 20; height: 58px; background: #FFFFFF; border-bottom: 1px solid #D1D3D6; display: flex; align-items: stretch; overflow: visible; font-family: 'Roboto', sans-serif; box-sizing: border-box; resize: horizontal; min-width: 420px; max-width: 100%; }
  .app-header__logo { display: flex; align-items: center; padding-left: 24px; flex-shrink: 0; }
  .app-header--md .app-header__logo { padding-left: 16px; }
  .app-header__logo svg { display: block; height: 41px; width: 82px; }
  .app-header__tabs { display: flex; align-items: stretch; gap: 24px; margin-left: 24px; min-width: 0; }
  .app-header--md .app-header__tabs { gap: 16px; margin-left: 16px; }
  .app-header__tab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 4px; border: 0; background: transparent; font: 400 16px/24px 'Roboto', sans-serif; color: #55575C; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
  .app-header__tab:hover { background: #FAFAFA; }
  .app-header__tab:active { background: #F1F1F1; }
  .app-header__tab--selected { color: #F26522; border-bottom-color: #F26522; }
  .app-header__tab-badge { display: inline-grid; place-items: center; padding: 1px 5px; border-radius: 60px; background: #FF5449; color: #F7F7F8; font-size: 10px; line-height: 14px; }
  .app-header__tab-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #FF5449; margin-left: 4px; vertical-align: top; position: relative; top: 2px; }
  .app-header__chevron { width: 18px; height: 18px; }
  .app-header__chevron svg { display: block; width: 100%; height: 100%; }
  .app-header__more-wrap { position: relative; display: flex; align-items: stretch; }
  .app-header__menu { position: absolute; top: 100%; left: 0; min-width: 244px; background: #FFFFFF; border-radius: 4px; box-shadow: 0 2px 4px rgba(132, 132, 132, .14), 0 4px 5px rgba(132, 132, 132, .11), 0 1px 10px rgba(132, 132, 132, .2); z-index: 20; padding: 4px 0; }
  .app-header__menu button { display: flex; align-items: center; width: 100%; height: 48px; padding: 0 20px; border: 0; background: transparent; font: 400 16px/24px 'Roboto', sans-serif; color: #545454; cursor: pointer; text-align: left; }
  .app-header__menu button:hover { background: #FAFAFA; }
  .app-header__menu button:active { background: #F1F1F1; }
  .app-header__right { display: flex; align-items: center; gap: 8px; margin-left: auto; padding-right: 16px; flex-shrink: 0; }
  .app-header__rewards { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border: 1px solid #F26522; border-radius: 60px; background: transparent; color: #F26522; font: 500 14px/20px 'Roboto', sans-serif; cursor: pointer; white-space: nowrap; }
  .app-header__rewards:hover { background: rgba(242, 101, 34, .06); }
  .app-header__rewards:active { background: rgba(242, 101, 34, .14); }

  .offer-table-row__cta-link { flex-shrink: 0; border: none; background: none; padding: 0; font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; line-height: 20px; color: #0061A5; white-space: nowrap; cursor: pointer; }

  /* -- StatusChip -- */
  .status-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; font-size: 12px; line-height: 12px; letter-spacing: 0.4px; white-space: nowrap; font-family: 'Roboto', sans-serif; }

  .status-chip--received { background: #F0F8FF; color: #0061A5; border-radius: 4px; }
  .status-chip--sent { background: #E0E0E0; color: #212121; border-radius: 3px; }
  .status-chip--declined { background: #FFEFBF; color: #402D00; border-radius: 4px; }
  /* 2026-08 新增,来自 card 内容规范"grey fill, dark grey text",不是
     Figma 核实数值,照 Sent 的灰底配了个比 Sent 更浅的深灰做区分 */
  .status-chip--expired { background: #E0E0E0; color: #55575C; border-radius: 4px; }
  .status-chip--overflow { background: #E0E0E0; color: #212121; border-radius: 3px; justify-content: center; }

  .status-chip-gallery { display: flex; flex-direction: column; gap: 24px; font-family: 'Roboto', sans-serif; }

  .offer-type-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 6px; border-radius: 4px; font-size: 12px; line-height: 12px; letter-spacing: 0.4px; white-space: nowrap; font-family: 'Roboto', sans-serif; box-sizing: border-box; }
  .offer-type-badge--in-negotiation { background: #1C1D1F; color: #FFFFFF; border: 1px solid #FFFFFF; }
  .offer-type-badge--make-offer { background: #FFFFFF; color: #0E0E0F; border: 1px solid #8D9199; }

  /* -- TypeGuide (2026-09-14 新增,从 InformationDialog/OfferTableHeader
     抽出来的共用组件,细节见 TypeGuide.vue 文件头 METADATA) -- */
  .type-guide { position: absolute; top: calc(100% + 10px); left: 0; z-index: 20; width: 320px; display: flex; flex-direction: column; gap: 20px; padding: 20px; background: #F5FBFF; border-radius: 16px; box-shadow: 0 11px 15px rgba(132, 132, 132, 0.2), 0 9px 46px rgba(132, 132, 132, 0.12), 0 24px 38px rgba(132, 132, 132, 0.14); font-family: 'Roboto', sans-serif; cursor: default; white-space: normal; }
  .type-guide__arrow { position: absolute; top: -8px; width: 16px; height: 8px; background: #F5FBFF; clip-path: polygon(50% 0, 0 100%, 100% 100%); }
  .type-guide__head { display: flex; align-items: center; justify-content: space-between; }
  .type-guide__title { font-size: 20px; font-weight: 500; line-height: 30px; letter-spacing: 0.15px; color: #0E0E0F; }
  .type-guide__close { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: none; background: none; padding: 0; cursor: pointer; flex-shrink: 0; }
  .type-guide__section { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .type-guide__desc { width: 100%; margin: 0; font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0.1px; color: #0E0E0F; }
  .type-guide__desc strong { font-weight: 500; }
  .type-guide__footer { display: flex; align-items: center; justify-content: flex-end; }
  .type-guide__btn { border: none; background: #0077D8; color: #FFFFFF; padding: 8px 16px; border-radius: 100px; font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; line-height: 14px; letter-spacing: 0.1px; white-space: nowrap; cursor: pointer; }
  /* -- TypeGuideGallery (Type Guide Playground 展示壳,2026-09-14 改版:
     buyer/seller 同时铺出来,不用切换。TypeGuide 自己是 position:absolute,
     每个实例单独包一层没有强制高度的 anchor,细节见 TypeGuideGallery 旁边
     的注释。) -- */
  .type-guide-gallery { display: flex; align-items: flex-start; gap: 32px; font-family: 'Roboto', sans-serif; }
  /* min-height 只用来给舞台容器一个真实高度参考(卡片是 position:absolute,
     撑不出正常流高度),不设在 anchor 上,不影响 TypeGuide 的 top 计算基准。 */
  .type-guide-gallery__item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 400px; }
  .type-guide-gallery__label { font-size: 12px; line-height: 16px; color: #757575; }
  .type-guide-gallery__anchor { position: relative; width: 320px; }

  /* -- OfferTypeBadgeGallery (Offer Type Badge Playground 展示壳,2026-09-11) -- */
  .offer-type-badge-gallery { display: flex; align-items: flex-start; gap: 32px; font-family: 'Roboto', sans-serif; }
  .offer-type-badge-gallery__item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .offer-type-badge-gallery__label { font-size: 12px; line-height: 16px; color: #757575; }

  /* -- Pagination -- */
  /* 2026-08 重做:ACV Pagination(Claude Design 项目 09c-pagination.card.html） */
  .pagination { display: flex; align-items: center; gap: 16px; background: #FFFFFF; padding: 12px 16px; border-radius: 4px; font-family: 'Roboto', sans-serif; }
  .pagination__label { font-size: 14px; line-height: 20px; color: #212121; white-space: nowrap; }
  .pagination__viewing-text { flex: 1; min-width: 0; font-size: 14px; line-height: 21px; letter-spacing: 0.25px; color: #212121; }
  .pagination__dropdown-wrap { position: relative; }
  .pagination__dropdown-btn { display: flex; align-items: center; justify-content: space-between; gap: 4px; width: 70px; height: 36px; padding: 0 8px; border: 1px solid #DCDFE8; border-radius: 4px; background: #FFFFFF; color: #212121; font-family: 'Roboto', sans-serif; font-size: 14px; line-height: 20px; cursor: pointer; box-sizing: border-box; }
  .pagination__dropdown-btn:focus-visible, .pagination__dropdown-btn--open { outline: none; box-shadow: 0 0 0 3px #CFE3F5; }
  .pagination__dropdown-btn svg { display: block; flex-shrink: 0; }
  .pagination__dropdown-value { line-height: 20px; }
  .pagination__menu { position: absolute; top: calc(100% + 1px); left: 0; min-width: 100%; background: #FFFFFF; border: 1px solid #DCDFE8; border-radius: 0 0 4px 4px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); padding: 0; margin: 0; list-style: none; z-index: 5; }
  .pagination__menu li { padding: 8px 12px; font-size: 14px; line-height: 20px; color: #55575C; cursor: pointer; white-space: nowrap; }
  .pagination__menu li:hover { background: #F0F1F4; }
  .pagination__menu li[aria-selected='true'] { background: #1A73E8; color: #FFFFFF; }
  .pagination__nav { display: flex; align-items: center; gap: 33px; margin-left: 8px; }
  .pagination__arrow { display: grid; place-items: center; width: 24px; height: 24px; border: none; background: transparent; padding: 0; color: #212121; cursor: pointer; }
  .pagination__arrow svg { display: block; }
  .pagination__arrow:disabled { color: #A1A1A1; cursor: default; }
  .pagination__arrow:not(:disabled):hover { background: #F0F1F4; border-radius: 50%; }
  .pagination__arrow:focus-visible { outline: 2px solid #0061A5; outline-offset: 1px; border-radius: 50%; }

  /* -- OfferDashboard -- */
  /* 2026-08 修正:width 原来是估的 1400px,和 sidebar(260)+content左右
     padding(16+24)+真实核实过的表格内容宽度(1122,来自 Figma Frame
     215286)加起来应该是 1422px 不完全对得上,差了 22px。之前因为
     Update 列是裸 flex:1 吃掉容器剩余空间,这 22px 的误差被它悄悄吸收,
     看不出来;现在其它列也改成比例伸缩后,这个误差会让所有列一起被
     压窄几个百分点,所以顺手把这个数改成算出来的精确值 1422px */
  /* 2026-08 改成 width:100%,始终填满外面新加的 .pg-stage__resize-frame
     (默认 1422px 宽,和之前写死在这里的值一样,所以默认预览不受影响);
     frame 宽度现在由 Controls 面板里的 screenWidth 滑块控制,细节见
     Harness 的 setup() 里 screenWidth/stageFrameStyle 那部分 */
  /* 2026-09-13(第五次)按你反馈修正:这条规则漏镜像了 OfferDashboard.vue
     源文件里本来就有的 min-height:100vh(2026-08 改成 width:100% 的时候
     不小心把这条也删掉了,属于镜像遗漏,不是有意的改动)。这条丢失直接
     导致 mobile 版内容很短(比如筛选完只剩1条)时,MobileBottomNav 不会
     贴在屏幕最底部——没有 min-height 撑住,.offer-dashboard 的 flex 容器
     只会按内容自然高度收缩,MobileBottomNav(没有设 flex-grow)就贴在
     内容后面,下面留一截空白,不是贴底。补回 min-height:100vh 之后,
     .offer-dashboard__mobile-body 已有的 flex:1 会正确吃掉容器里多出来
     的空间,把 MobileBottomNav 顶到底部,细节和 Playground 里额外需要的
     处理(vh 在这个舞台的模拟手机框里不等于真的 844px)见下面
     .pg-stage__resize-frame--device .offer-dashboard 那条只在 Playground
     里生效的覆盖规则。 */
  .offer-dashboard { display: flex; flex-direction: column; background: #FFFFFF; min-height: 100vh; font-family: 'Roboto', sans-serif; width: 100%; }
  /* 上面这条 min-height:100vh 是照抄 OfferDashboard.vue 源文件的真实
     生产行为(真机上 100vh 就是真实屏幕高度,没有问题)。但在这个
     Playground 里,"手机屏幕"是 .pg-stage__resize-frame--device 这个
     844px 高的模拟框,不是真的浏览器 viewport——vh 只认真实浏览器窗口
     高度,跟这个模拟框的844px完全是两回事(真实浏览器窗口通常比844高,
     会导致 mobile 页面在 Playground 里比模拟屏幕还高,要多余地内部滚动
     才能看到 MobileBottomNav)。这条规则只在 Playground 的 Harness 里
     加(不属于 OfferDashboard.vue 本身,不会镜像回 fragment 源文件),
     把 min-height 从"真实vh" 覆盖成"父元素(模拟手机框)高度的100%"——
     由于模拟手机框自己有明确的 844px 行内高度,百分比能正确解析成
     844px,和真实手机上 100vh=真实屏幕高度 的效果对齐。 */
  .pg-stage__resize-frame--device .offer-dashboard { min-height: 100%; }
  /* 2026-08 核实自节点 7448:9826:App Bar→breadcrumb 原为24px(2026-08
     按你的要求改成32px,截图上直接标出来的,不是重新核实的 Figma 数值),
     breadcrumb→Tabs 14px。左边距(292px = sidebar宽260 + 新增左边距16
     + 间距16)现在用 cqw 换算成响应式公式,frame 正好 1422px 宽时算出来
     精确等于 292px;frame 变宽后间距最多长到 100px(2026-08 你说 110px
     还是宽,改成 100px),不会无限变大——这样 breadcrumb 才能跟着
     Buying/Selling/表格一起右移,不会自己停在原地不动。斜率是
     (100-16)/(1900-1422)=84/478≈0.1757,让间距刚好在屏宽到 1900px 时
     就长到 100px 封顶,不是要宽到很多才勉强摸到封顶值 */
  /* 2026-08 按你的要求:breadcrumb 这一行和下面 .offer-dashboard__content
     (Buying/Selling tab + 搜索/筛选 + 表格整块)右侧留 100px 空隙,视口
     右边缘对齐——这两块是分开的 DOM sibling,分别加同一个
     margin-right:100px,等同于套了共同外层容器,不改动各自内部已有的
     padding/gap,也没动 SidebarNav */
  /* 2026-08 按你的要求:sidebar↔主内容区最小间距从16px改成48px——最小值
     (clamp下限)和公式里的基准常数一起从16改成48,屏宽1422px(默认)时
     直接就是48px,不再是16;封顶值仍是100px,新斜率
     (100-48)/(1900-1422)=52/478≈0.1088,保持"屏宽到1900px正好封顶"
     这个规则不变 */
  /* 2026-09-08(第九次,已撤销固定值)你指出 sidebar→内容区这段间距
     不要改成固定值,还是要保留响应式(随容器宽度变化),只是把原来的
     最小值48px改成24px,最大值100px不变,细节见
     fragments/OfferDashboard/notes.md 同名条目。284px = 24(sidebar的
     margin-left,这个保持固定不变)+260(sidebar宽度),后面
     clamp(24px,...,100px)是响应式的那一段,和下面
     .offer-dashboard__content 的 padding-left 用的是同一个表达式。 */
  .offer-dashboard__breadcrumb-row { padding: 32px 0 14px 0; padding-left: calc(284px + clamp(24px, calc(24px + (100cqw - 1422px) * 0.159), 100px)); margin-right: clamp(24px, calc(24px + (100cqw - 1422px) * 0.159), 100px); }
  .offer-dashboard__body { display: flex; flex: 1; }
  /* 2026-09-08 按你的要求从16px改成24px,这一段(sidebar自己离视口左边
     的距离)你没有要求改成响应式,保持固定24px,细节见
     fragments/OfferDashboard/notes.md 同名条目 */
  .offer-dashboard__body .sidebar-nav { margin-top: -54px; margin-left: 24px; }
  /* 2026-09-08(第九次,已撤销固定值)恢复响应式,最小值从48px改成24px,
     最大值100px不变——frame宽度到1422px(cqw)时精确等于24px,之后跟着
     变宽,到约1900px(cqw)封顶在100px */
  .offer-dashboard__content { flex: 1; min-width: 0; padding: 0 24px 24px 0; padding-left: clamp(24px, calc(24px + (100cqw - 1422px) * 0.159), 100px); margin-right: clamp(24px, calc(24px + (100cqw - 1422px) * 0.159), 100px); display: flex; flex-direction: column; gap: 0; }
  /* 2026-08 核实自节点 7448:9826:Tabs→搜索框24px,搜索框→筛选chip行16px */
  .offer-dashboard__toolbar { display: flex; flex-direction: column; gap: 16px; padding: 24px 0 0; }
  .offer-dashboard__filters { flex-wrap: wrap; }
  /* 2026-08 按你的要求去掉横线:Figma里筛选chip行到Private Lane行之间
     没有分割线,只有20px纯留白(节点7448:9899 gap-20),之前的border-top
     没有Figma依据,已删掉改成margin-top */
  .offer-dashboard__table-card { margin-top: 20px; }
  /* 2026-09-08:table view 每一列不再靠 flex-shrink 挤宽度(见
     OfferTableHeader/OfferTableRow 的 CSS),窄屏下改成这个容器自己横向
     滚动,细节见 fragments/OfferDashboard/notes.md 同名条目 */
  .offer-dashboard__table-scroll { display: grid; overflow-x: auto; scrollbar-width: none; }
  .offer-dashboard__table-scroll::-webkit-scrollbar { display: none; }
  .offer-dashboard__table-bottom { position: sticky; bottom: 0; z-index: 1; border-top: 1px solid #DCDFE8; }
  .offer-dashboard__table-hscroll-shadow { position: sticky; z-index: 1; overflow-x: auto; overflow-y: hidden; height: 17px; }
  .offer-dashboard__table-hscroll-spacer { height: 1px; }
  /* Private Lane行→表头16px(节点7448:9916 "Table" gap-16) */
  /* 2026-09-02:table-top 那一条工具条(Viewing N results / Private
     Lane+Pagination / table-tile 切换按钮)已经抽成独立组件
     ResultsToolbar,CSS 挪到下面单独一段(class 名字从
     offer-dashboard__* 改成 results-toolbar__*),这里不再重复定义 */
  .offer-dashboard__card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; padding-bottom: 16px; }
  .offer-dashboard__empty { padding: 40px 16px; text-align: center; color: #757575; font-size: 14px; }
  /* -- OfferDashboard mobile layout (2026-09-11) -- */
  .offer-dashboard__mobile-body { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 0 16px 16px; box-sizing: border-box; }
  .offer-dashboard__toolbar--mobile { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 0; }
  .offer-dashboard__mobile-list { display: flex; flex-direction: column; gap: 16px; }
  /* 2026-09-13 按你的要求新增:容器 >=760px 时 2 列并排,<760px 时保持
     单列、且去掉 OfferCard 自己给桌面网格用的 max-width:420px,细节见
     OfferDashboard.vue 同名注释。 */
  .offer-dashboard__mobile-list .offer-card { max-width: none; }
  .offer-dashboard__mobile-list--two-col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

  /* -- ResultsToolbar -- */
  .results-toolbar { display: flex; align-items: center; justify-content: flex-end; padding: 16px 0; }
  .results-toolbar__spacer { flex: 1; display: flex; align-items: center; gap: 16px; }
  .results-toolbar__private-lane { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; letter-spacing: 0.4px; color: #545454; }
  .results-toolbar__private-lane-icon { flex-shrink: 0; }
  .results-toolbar__viewing-text { font-size: 14px; line-height: 21px; letter-spacing: 0.25px; color: #212121; }
  .results-toolbar__view-toggle { display: flex; align-items: center; }
  /* 2026-09-02 按 Figma node 7320:22065("segmented button") 重做:padding
     驱动尺寸(10px/12px),不再写死 32x32px 正方形,细节见
     fragments/ResultsToolbar/ResultsToolbar.vue 同一处注释 */
  .results-toolbar__view-toggle-btn { display: flex; align-items: center; justify-content: center; padding: 10px 16px; background: #FFFFFF; border: 1px solid #D1D3D6; border-radius: 0; cursor: pointer; box-sizing: border-box; }
  .results-toolbar__view-toggle-btn:first-child { border-radius: 111px 0 0 111px; }
  .results-toolbar__view-toggle-btn:last-child { border-left: none; border-radius: 0 111px 111px 0; }
  .results-toolbar__view-toggle-btn--active { background: #F5F5F5; }

  /* -- ImageBadge -- */
  .image-badge { position: relative; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; letter-spacing: 0.4px; white-space: nowrap; border-radius: 8px; box-sizing: border-box; }
  .image-badge--in-negotiation { background: #1C1D1F; color: #FFFFFF; padding: 3px 6px; }
  .image-badge--make-offer { background: #FFFFFF; color: #0E0E0F; padding: 3px 6px; }
  .image-badge--make-offer-stroke { border: 1px solid #8D9199; padding: 2px 6px; }
  .image-badge--dealer { backdrop-filter: blur(0.75px); background: rgba(0, 0, 0, 0.4); color: #FFFFFF; text-align: right; padding: 3px 10px; }

  /* -- ImageBadgeGallery (Image Badge Playground 展示壳,2026-09-11) -- */
  .image-badge-gallery { display: flex; align-items: flex-start; gap: 32px; font-family: 'Roboto', sans-serif; }
  .image-badge-gallery__item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .image-badge-gallery__label { font-size: 12px; line-height: 16px; color: #757575; }

  /* -- OfferCard -- */
  .offer-card { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; justify-self: center; padding-bottom: 12px; background: #FFFFFF; border: 1px solid #E8E9EB; border-radius: 12px; overflow: hidden; font-family: 'Roboto', sans-serif; box-sizing: border-box; }
  /* 2026-08 按你的要求新增,对照节点 7498:68345 的 V1 hover 按钮。只在
     V1 模式下 hover 才模糊——V2 的按钮也在 .offer-card__info 里面,如果
     不限定 .offer-card--v1,V2 模式 hover 卡片会把它自己一直可见的按钮
     也模糊掉,那是不对的,两个版本是完全独立的交互 */
  /* 2026-08 按 "Offer card — content & interaction spec" 第4节更正:
     1按钮和2按钮的模糊覆盖范围应该一样("identity + status dimmed,
     message stays readable"),之前1按钮只模糊车辆信息,现在也扩大到
     车辆信息+倒计时/状态chip行,和2按钮一致。3按钮(整个info区)不变 */

      var chipsDrag = { active: false, startX: 0, startScrollLeft: 0, moved: false, el: null };
      function handleChipsMouseDown(e) {
        if (!props.mobile) return;
        chipsDrag.active = true;
        chipsDrag.moved = false;
        chipsDrag.startX = e.clientX;
        chipsDrag.el = e.currentTarget;
        chipsDrag.startScrollLeft = chipsDrag.el.scrollLeft;
        window.addEventListener('mousemove', handleChipsMouseMove);
        window.addEventListener('mouseup', handleChipsMouseUp);

      function handleChipsMouseMove(e) {
        if (!chipsDrag.active) return;

        chipsDrag.el.scrollLeft = chipsDrag.startScrollLeft - dx;

      function handleChipsMouseUp() {
        chipsDrag.active = false;
        window.removeEventListener('mousemove', handleChipsMouseMove);
        window.removeEventListener('mouseup', handleChipsMouseUp);

      watch(function () { return props.receivedCount; }, function (v) { if (isZero(v) && singleSelected.value === 'received') singleSelected.value = null; });

      '<div v-if="specPanel.visible" class="pg-spec-panel" :style="{ top: specPanel.top + \'px\', left: specPanel.left + \'px\' }">' +
      '<div class="pg-spec-panel__head">' +
      '<span class="pg-spec-panel__title">{{ specPanel.title }}</span>' +
      '<button type="button" class="pg-spec-panel__close" aria-label="Close" @click="closeSpecPanel">×</button>' +
      '</div>' +
      '<div class="pg-spec-panel__body">' +
      '<template v-for="(row, i) in specPanel.rows" :key="i">' +
      '<div v-if="row.section" class="pg-spec-panel__section">{{ row.section }}</div>' +
      '<div v-if="row.label" class="pg-spec-panel__row"><span class="pg-spec-panel__row-label">{{ row.label }}</span><span class="pg-spec-panel__row-value">{{ row.value }}</span></div>' +
      '</template>' +
      '</div>' +
      '<div class="pg-spec-panel__foot"><button type="button" class="pg-control-button pg-spec-panel__copy" @click="copySpecCss">Copy CSS</button></div>' +
      '</div>' +
      '</main></div>'
  });

  createApp(Harness).mount('#app');
})();
</script>

<script>
// 只在通过 http:// 本地服务器打开时才轮询检查文件是否被改过(改了就自动
// 刷新页面);直接双击用 file:// 打开时 fetch 会失败,不影响正常使用。
(function () {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  var lastModified = null;
  function checkForUpdate() {
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
      .then(function (res) {
        var lm = res.headers.get('Last-Modified');
        if (lastModified === null) { lastModified = lm; return; }
        if (lm && lm !== lastModified) { location.reload(); }
      })
      .catch(function () {});
  }
  setInterval(checkForUpdate, 1500);
})();
</script>
