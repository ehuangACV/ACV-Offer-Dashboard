<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ACV Offer Dashboard — Component Playground</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Roboto', -apple-system, sans-serif; color: #212121; background: #F5F5F5; }
  #app { height: 100%; }

  /* ===================== Playground chrome ===================== */
  .pg-shell { display: flex; height: 100%; }
  .pg-sidebar { width: 260px; flex-shrink: 0; background: #1C1D1F; color: #fff; overflow: hidden; padding: 16px 0; transition: width .22s ease, padding .22s ease; box-sizing: border-box; }
  .pg-sidebar__inner { width: 260px; height: 100%; overflow-y: auto; }
  .pg-sidebar--collapsed { width: 0; padding-top: 16px; padding-bottom: 16px; }
  .pg-rail-toggle { flex-shrink: 0; width: 14px; align-self: stretch; border: none; background: #E8E9EB; color: #757575; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
  .pg-rail-toggle:hover { background: #F26522; color: #fff; }
  .pg-sidebar__title { font-size: 14px; font-weight: 700; padding: 0 16px 16px; letter-spacing: .3px; border-bottom: 1px solid #333; margin-bottom: 8px; }
  .pg-group { margin-bottom: 12px; }
  .pg-group__title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #9A9CA2; padding: 8px 16px 4px; }
  .pg-nav-item { display: block; width: 100%; text-align: left; padding: 8px 16px; border: none; background: none; color: #D1D3D6; font-size: 13px; cursor: pointer; }
  .pg-nav-item:hover { background: #2A2B2D; color: #fff; }
  .pg-nav-item--active { background: #F26522; color: #fff; font-weight: 500; }
  .pg-nav-item__order { display: inline-block; width: 22px; color: #757575; font-size: 11px; }
  .pg-nav-item--active .pg-nav-item__order { color: rgba(255,255,255,.7); }

  .pg-main { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 32px; }
  .pg-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .pg-header h1 { font-size: 20px; margin: 0; }
  .pg-header__meta { font-size: 12px; color: #757575; }

  .pg-mocks { display: flex; align-items: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .pg-mocks__label { font-size: 12px; color: #757575; font-weight: 500; }
  .pg-mock-btn { border: 1px solid #DCDFE8; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: #004E7D; }
  .pg-mock-btn:hover { background: #F0F8FF; }

  .pg-workspace { display: flex; align-items: flex-start; }
  .pg-stage { flex: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E8E9EB; border-radius: 8px; padding: 24px; overflow: auto; }

  /* 2026-08 按你的要求新增:整页组件(比如 Offer Dashboard)右上角
     "Expand to full page" 按钮,方便你做 presentation 时全屏看效果。这
     一整块都是 Playground 自己的外壳 UI,不属于任何 fragment 组件,不会
     改到 OfferDashboard.vue 等真实组件文件。 */
  .pg-main { position: relative; }
  .pg-fullscreen-btn { position: absolute; top: 24px; right: 32px; z-index: 20; display: flex; align-items: center; gap: 6px; border: 1px solid #DCDFE8; background: #fff; border-radius: 6px; padding: 6px 14px; font-size: 13px; color: #004E7D; cursor: pointer; }
  .pg-fullscreen-btn:hover { background: #F0F8FF; }

  .pg-shell--fullscreen .pg-sidebar,
  .pg-shell--fullscreen .pg-rail-toggle--sidebar,
  .pg-shell--fullscreen .pg-header,
  .pg-shell--fullscreen .pg-mocks,
  .pg-shell--fullscreen .pg-notes { display: none; }
  .pg-shell--fullscreen .pg-main { position: fixed; inset: 0; padding: 0; z-index: 1000; background: #fff; overflow: auto; }
  .pg-shell--fullscreen .pg-workspace { height: 100%; align-items: stretch; }
  .pg-shell--fullscreen .pg-stage { height: 100%; border: none; border-radius: 0; padding: 0; }
  /* pg-stage 在全屏时 padding 已经清零(见上面 padding:0 那条),
     Dashboard 自己的 AppHeader 现在会紧贴到真正的屏幕左上角——如果这个
     按钮还留在 top:12/right:12,会正好盖住 AppHeader 右侧的铃铛/头像/
     菜单图标。挪到 AppHeader(58px 高)下方、breadcrumb 那一行右侧的
     空白区域,不会挡住任何真实内容 */
  .pg-shell--fullscreen .pg-fullscreen-btn { top: 66px; right: 16px; }
  /* 2026-08 新增 screenWidth 滑块控件(只在选中 Offer Dashboard 时出现)
     之后,把"全屏时铺满可用宽度"和"用滑块模拟任意屏幕宽度"统一成同一套
     机制,细节(container-type、cqw 换算公式)见下面 .offer-dashboard
     相关规则旁边的注释,这里不重复。 */
  .pg-stage__resize-frame { container-type: inline-size; }
  /* 2026-08 按你的要求:全屏时右边不应该有空白,Buying/Selling下面那条
     横线(以及搜索框/筛选chip行/表格,它们右边界都是同一个)之前都会在
     content 右边固定留 24px 的padding,导致这些行的右边缘都停在比
     AppHeader(已经是真全屏无边距)更靠左24px的地方,看起来像多出一块
     没用到的空白。这里全屏时把这个固定的右padding去掉,让内容右边界
     和AppHeader一样贴到真正的屏幕右边缘,不再单独处理"这条线"一个元素,
     这样和它同一行/同一右边界的其它内容也会一起对齐,不会顾此失彼。 */
  .pg-shell--fullscreen .offer-dashboard__content { padding-right: 0; }
  .pg-rail-toggle--controls { margin: 0 8px; border-radius: 4px; height: 32px; align-self: center; }
  .pg-controls { width: 300px; flex-shrink: 0; background: #fff; border: 1px solid #E8E9EB; border-radius: 8px; padding: 16px; overflow: hidden; box-sizing: border-box; transition: width .22s ease, padding .22s ease, border-color .22s ease; }
  .pg-controls__inner { width: 268px; }
  .pg-controls--collapsed { width: 0; padding-left: 0; padding-right: 0; border-color: transparent; }
  .pg-controls__title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: #545454; text-transform: uppercase; letter-spacing: .3px; }
  .pg-control-field { margin-bottom: 16px; }
  /* 2026-09 按你给的截图重做:label 从"小灰字"改成"深色粗体小标题"
     (对应截图里"Viewport"这种section标题的分量),不再是不起眼的
     附属说明文字 */
  .pg-control-field label { display: block; font-size: 14px; font-weight: 600; color: #1F2430; margin-bottom: 8px; }
  .pg-control-field select, .pg-control-field input[type=text], .pg-control-field input[type=number] { width: 100%; padding: 9px 12px; border: 1px solid #D8DAE0; border-radius: 8px; font-size: 13px; color: #1F2430; box-sizing: border-box; transition: border-color .15s ease, box-shadow .15s ease; }
  .pg-control-field select:focus, .pg-control-field input[type=text]:focus, .pg-control-field input[type=number]:focus { outline: none; border-color: #6C7BFF; box-shadow: 0 0 0 3px rgba(108,123,255,.15); }
  /* 布尔控件画成 iOS 风格的开关,而不是普通 checkbox */
  .pg-control-field input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 36px;
    height: 20px;
    border-radius: 999px;
    background: #DCDFE8;
    position: relative;
    cursor: pointer;
    outline: none;
    vertical-align: middle;
    transition: background-color .15s ease;
  }
  .pg-control-field input[type=checkbox]::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform .15s ease;
  }
  .pg-control-field input[type=checkbox]:checked { background: #F26522; }
  .pg-control-field input[type=checkbox]:checked::before { transform: translateX(16px); }
  /* 2026-09 按你给的截图重做 reset 这颗按钮:浅灰底、深色粗体字、居中,
     不再是描边橙色小按钮 */
  .pg-control-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; border: 1px solid #E4E6EC; border-radius: 10px; background: #F3F4F6; color: #1F2430; font-size: 14px; font-weight: 700; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
  .pg-control-button::before { content: '↺'; font-size: 15px; font-weight: 400; }
  .pg-control-button:hover { background: #E9EBEF; border-color: #D8DAE0; }
  .pg-control-button:active { background: #DEE1E7; }
  /* 2026-09 新增分段按钮控件(截图里 Viewport 那一排 Desktop/Tablet/
     Mobile 的样式)——一排等宽/自适应的圆角按钮,选中的一个填蓝色实底,
     其余描边灰色。用于 cardVersion 这种"只有几个互斥选项"的控件,
     取代原来不起眼的 <select> 下拉。 */
  .pg-segmented { display: flex; flex-wrap: wrap; gap: 8px; }
  .pg-segmented__btn { display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1 1 auto; padding: 10px 14px; border: 1px solid #D8DAE0; border-radius: 8px; background: #FFFFFF; color: #1F2430; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
  .pg-segmented__btn:hover { background: #F3F4F6; }
  .pg-segmented__btn--active { background: #2F5BFF; border-color: #2F5BFF; color: #FFFFFF; }
  .pg-segmented__btn--active:hover { background: #2450E6; }
  .pg-control-range { display: flex; align-items: center; gap: 8px; }
  .pg-control-range input[type=range] { flex: 1; min-width: 0; }
  .pg-control-range__value { font-size: 12px; color: #545454; white-space: nowrap; min-width: 44px; text-align: right; }
  .pg-no-controls { color: #9A9CA2; font-size: 13px; width: 300px; flex-shrink: 0; margin-left: 24px; }

  .pg-notes { margin-top: 20px; background: #fff; border: 1px solid #E8E9EB; border-radius: 8px; padding: 4px 16px; }
  .pg-notes summary { cursor: pointer; padding: 10px 0; font-size: 13px; font-weight: 600; color: #545454; }
  .pg-notes pre { white-space: pre-wrap; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12.5px; line-height: 1.6; color: #333; padding-bottom: 12px; }

  /* ===================== Fragment component styles ===================== */
  /* -- AppHeader -- */
  .app-header { position: relative; height: 58px; background: #FFFFFF; border-bottom: 1px solid #D1D3D6; display: flex; align-items: stretch; overflow: visible; font-family: 'Roboto', sans-serif; box-sizing: border-box; resize: horizontal; min-width: 420px; max-width: 100%; }
  .app-header__logo { display: flex; align-items: center; padding-left: 24px; flex-shrink: 0; }
  .app-header--md .app-header__logo { padding-left: 16px; }
  .app-header__logo svg { display: block; height: 41px; width: 82px; }
  .app-header__tabs { display: flex; align-items: stretch; gap: 24px; margin-left: 24px; min-width: 0; }
  .app-header--md .app-header__tabs { gap: 16px; margin-left: 16px; }
  .app-header__tab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 4px; border: 0; background: transparent; font: 400 16px/24px 'Roboto', sans-serif; color: #55575C; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
  .app-header__tab:hover { background: #FAFAFA; }
  .app-header__tab:active { background: #F1F1F1; }
  .app-header__tab--selected { color: #F26522; border-bottom-color: #F26522; }
  .app-header__tab-badge { display: inline-grid; place-items: center; padding: 1px 5px; border-radius: 60px; background: #FF5449; color: #F7F7F8; font-size: 10px; line-height: 14px; }
  .app-header__tab-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #FF5449; margin-left: 4px; vertical-align: top; position: relative; top: 2px; }
  .app-header__chevron { width: 18px; height: 18px; }
  .app-header__chevron svg { display: block; width: 100%; height: 100%; }
  .app-header__more-wrap { position: relative; display: flex; align-items: stretch; }
  .app-header__menu { position: absolute; top: 100%; left: 0; min-width: 244px; background: #FFFFFF; border-radius: 4px; box-shadow: 0 2px 4px rgba(132, 132, 132, .14), 0 4px 5px rgba(132, 132, 132, .11), 0 1px 10px rgba(132, 132, 132, .2); z-index: 20; padding: 4px 0; }
  .app-header__menu button { display: flex; align-items: center; width: 100%; height: 48px; padding: 0 20px; border: 0; background: transparent; font: 400 16px/24px 'Roboto', sans-serif; color: #545454; cursor: pointer; text-align: left; }
  .app-header__menu button:hover { background: #FAFAFA; }
  .app-header__menu button:active { background: #F1F1F1; }
  .app-header__right { display: flex; align-items: center; gap: 8px; margin-left: auto; padding-right: 16px; flex-shrink: 0; }
  .app-header__rewards { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border: 1px solid #F26522; border-radius: 60px; background: transparent; color: #F26522; font: 500 14px/20px 'Roboto', sans-serif; cursor: pointer; white-space: nowrap; }
  .app-header__rewards:hover { background: rgba(242, 101, 34, .06); }
  .app-header__rewards:active { background: rgba(242, 101, 34, .14); }
  .app-header__rewards-icon { width: 18px; height: 18px; }
  .app-header__rewards-icon svg { display: block; width: 100%; height: 100%; }
  .app-header__rewards-icon-btn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #D44D0C; border-radius: 50%; background: transparent; color: #F26522; cursor: pointer; padding: 0; }
  .app-header__rewards-icon-btn:hover { background: rgba(212, 77, 12, .06); }
  .app-header__rewards-icon-btn svg { display: block; width: 20px; height: 20px; }
  .app-header__tooltip { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 4px; background: #1C1D1F; color: #F7F7F8; font: 400 12px/16px 'Roboto', sans-serif; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .1s ease; }
  .app-header__rewards-icon-btn:hover .app-header__tooltip, .app-header__rewards-icon-btn:focus-visible .app-header__tooltip { opacity: 1; }
  .app-header__icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%; color: #212121; cursor: pointer; padding: 0; }
  .app-header__icon-btn:hover { background: #F5F5F5; }
  .app-header__icon-btn:active { background: #E0E0E0; }
  .app-header__icon-btn:focus-visible { outline: 2px solid #7B61FF; outline-offset: -2px; }
  .app-header__icon-btn svg { display: block; width: 22px; height: 22px; }
  .app-header__profile { display: flex; align-items: center; gap: 8px; }
  .app-header__avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #F26522; color: #FFFFFF; font: 500 14px/20px 'Roboto', sans-serif; flex-shrink: 0; }
  .app-header__profile-text { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
  .app-header__username { font-size: 14px; color: #55575C; }
  .app-header__company { font-size: 12px; color: #55575C; }

  /* -- Breadcrumb -- */
  .breadcrumb { display: inline-flex; align-items: center; gap: 14px; font-family: 'Roboto', sans-serif; }
  .breadcrumb__item { font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: 0.15px; color: #545454; white-space: nowrap; }
  .breadcrumb__separator { display: inline-flex; width: 11px; height: 11px; flex-shrink: 0; }

  /* -- SidebarNav -- */
  .sidebar-nav { display: flex; flex-direction: column; gap: 4px; width: 260px; background: #FFFFFF; font-family: 'Roboto', sans-serif; padding: 0; }
  .sidebar-nav__item { position: relative; display: flex; align-items: center; justify-content: space-between; height: 56px; margin: 0 12px; padding: 0 12px 0 24px; border: none; border-radius: 59px; background: none; text-align: left; cursor: pointer; font-family: 'Roboto', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: 0.15px; color: #545454; }
  .sidebar-nav__item--active { background: #EBF6FF; color: #004E7D; font-weight: 500; }
  .sidebar-nav__item--active-row { padding-right: 12px; }
  .sidebar-nav__expand-icon { flex-shrink: 0; }
  .sidebar-nav__badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 8px; border-radius: 1000px; background: #FF5449; color: #F7F7F8; font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0.1px; }
  .sidebar-nav__divider { height: 39px; margin: 0 16px; position: relative; }
  .sidebar-nav__divider::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #DCDFE8; }

  /* -- OfferTabs -- */
  /* 2026-08 修复:底部分割线用 position:absolute+z-index:-1+1px高度的
     div 实际渲染基本看不见(抗锯齿掉了),改成 border-bottom(标准稳妥
     做法)+ box-sizing:border-box(不多占1px,不影响已核实的间距) */
  .offer-tabs { position: relative; display: flex; align-items: stretch; font-family: 'Roboto', sans-serif; border-bottom: 1px solid #DCDFE8; box-sizing: border-box; }
  .offer-tabs__tab { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; border: none; background: none; cursor: pointer; padding: 10px 16px 1px; font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: 0.15px; color: #757575; }
  .offer-tabs__tab--selected { background: #FEF9F6; border-radius: 8px; color: #F26522; font-weight: 500; }
  .offer-tabs__count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #D1D3D6; color: #55575C; font-family: 'Inter', 'Roboto', sans-serif; font-weight: 700; font-size: 12px; line-height: 18px; }
  .offer-tabs__tab--selected .offer-tabs__count { background: #F26522; color: #FFFFFF; }
  .offer-tabs__indicator { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 4px 4px 0 0; background: #F26522; }

  /* -- SearchInput -- */
  .search-input { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: #F7F7F8; border-radius: 4px 4px 0 0; box-sizing: border-box; }
  .search-input__icon { display: inline-flex; width: 20px; height: 20px; flex-shrink: 0; }
  .search-input__field { flex: 1; border: none; outline: none; background: none; font-family: 'Roboto', sans-serif; font-size: 16px; line-height: 24px; letter-spacing: 0.5px; color: rgba(0, 0, 0, 0.87); }
  .search-input__field::placeholder { color: rgba(0, 0, 0, 0.67); }

  /* -- FilterChipGroup -- */
  .filter-chip-group { display: flex; align-items: center; gap: 8px; font-family: 'Roboto', sans-serif; flex-wrap: wrap; }
  .filter-chip { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 6px 16px; border-radius: 8px; border: 1px solid #212121; background: #FFFFFF; color: #212121; font-size: 14px; font-weight: 400; line-height: 21px; letter-spacing: 0.25px; cursor: pointer; white-space: nowrap; }
  .filter-chip--dealership { padding-left: 16px; padding-right: 8px; }
  .filter-chip:disabled { border-color: #8D9199; color: #8D9199; cursor: not-allowed; }
  .filter-chip--selected { background: #F0F8FF; border-color: #0061A5; color: #0061A5; }
  /* 2026-08:应用了经销商筛选后,顶替按钮本来的位置(照抄之前独立chip的配色) */
  .filter-chip--dealer-active { background: #E6F6FC; border-color: #00558C; color: #00558C; padding-left: 14px; padding-right: 8px; }
  .filter-chip__dealer-label { white-space: nowrap; }
  .filter-chip__dealer-close { display: inline-flex; align-items: center; justify-content: center; color: #00558C; padding: 2px; border-radius: 50%; opacity: 0.85; }
  .filter-chip__dealer-close:hover { opacity: 1; background: rgba(0, 85, 140, 0.1); }
  .filter-chip-group__divider { width: 1px; height: 28px; background: #0E0E0F; flex-shrink: 0; }
  .filter-chip-group__clear { border: none; background: none; cursor: pointer; color: #004E7D; font-size: 14px; font-weight: 500; line-height: 14px; letter-spacing: 0.1px; margin-left: 4px; }

  /* -- DealershipFilterDropdown -- */
  /* 2026-08 重做:参照真实原型 My-ACV--Dealer-filter-main 的 V1 web
     dealership filter(固定 374x510 尺寸、CSS 画的 checkbox、确切的
     Apply Filter 渐变值),见 fragments/DealershipFilterDropdown/notes.md */
  .dealer-dropdown { display: flex; flex-direction: column; width: 374px; height: 510px; max-height: calc(100vh - 120px); background: linear-gradient(to bottom, #FFFFFF, #FAFBFC); border: 1px solid #E8E9EB; border-radius: 12px; box-shadow: 0px 25px 50px -12px rgba(0, 0, 0, 0.2); font-family: 'Roboto', sans-serif; overflow: hidden; }
  .dealer-dropdown__header { flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px; background: rgba(255, 255, 255, 0.95); border-bottom: 1px solid rgba(229, 231, 235, 0.6); position: sticky; top: 0; z-index: 1; }
  .dealer-dropdown__title-row { display: flex; align-items: center; justify-content: space-between; }
  .dealer-dropdown__title { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: 0.15px; color: #0E0E0F; }
  .dealer-dropdown__title-actions { display: flex; align-items: center; gap: 12px; }
  .dealer-dropdown__selected-count { font-size: 14px; line-height: 21px; letter-spacing: 0.25px; color: #757575; }

  .offer-table-header__guide { position: absolute; top: calc(100% + 14px); left: -12px; z-index: 20; width: 320px; display: flex; flex-direction: column; gap: 20px; padding: 20px; background: #F5FBFF; border-radius: 16px; box-shadow: 0 11px 15px rgba(132, 132, 132, 0.2), 0 9px 46px rgba(132, 132, 132, 0.12), 0 24px 38px rgba(132, 132, 132, 0.14); font-family: 'Roboto', sans-serif; cursor: default; }

  .offer-table-row__cell { position: relative; height: 80px; box-sizing: border-box; padding: 21px 16px 0; border-bottom: 1px solid #DCDFE8; font-size: 14px; color: #212121; }

  .offer-table-row__vehicle-title { font-size: 14px; line-height: 21px; letter-spacing: 0.25px; color: #212121; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .offer-table-row__vehicle-sub { margin-top: 0; display: flex; align-items: center; justify-content: flex-start; gap: 2px; font-size: 12px; line-height: 18px; letter-spacing: 0.4px; color: #757575; }

  /* -- StatusChip -- */
  .status-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; font-size: 12px; line-height: 12px; letter-spacing: 0.4px; white-space: nowrap; font-family: 'Roboto', sans-serif; }

  .status-chip--new { background: #F4FFF6; color: #006C4C; border-radius: 4px; }
  .status-chip--received { background: #F0F8FF; color: #0061A5; border-radius: 4px; }
  .status-chip--sent { background: #E0E0E0; color: #212121; border-radius: 3px; }
  .status-chip--declined { background: #FFEFBF; color: #402D00; border-radius: 4px; }
  /* 2026-08 新增,来自 card 内容规范"grey fill, dark grey text",不是
     Figma 核实数值,照 Sent 的灰底配了个比 Sent 更浅的深灰做区分 */
  .status-chip--expired { background: #E0E0E0; color: #55575C; border-radius: 4px; }

  /* -- OfferTypeBadge -- */
  .offer-type-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 6px; border-radius: 4px; font-size: 12px; line-height: 12px; letter-spacing: 0.4px; white-space: nowrap; font-family: 'Roboto', sans-serif; box-sizing: border-box; }
  .offer-type-badge--in-negotiation { background: #1C1D1F; color: #FFFFFF; border: 1px solid #FFFFFF; }
  .offer-type-badge--make-offer { background: #FFFFFF; color: #0E0E0F; border: 1px solid #8D9199; }

  /* -- Pagination -- */
  /* 2026-08 重做:ACV Pagination(Claude Design 项目 09c-pagination.card.html） */
  .pagination { display: flex; align-items: center; gap: 16px; background: #FFFFFF; padding: 12px 16px; border-radius: 4px; font-family: 'Roboto', sans-serif; }
  .pagination__label { font-size: 14px; line-height: 20px; color: #212121; white-space: nowrap; }
  .pagination__viewing-text { flex: 1; min-width: 0; font-size: 14px; line-height: 21px; letter-spacing: 0.25px; color: #212121; }
  .pagination__dropdown-wrap { position: relative; }
  .pagination__dropdown-btn { display: flex; align-items: center; justify-content: space-between; gap: 4px; width: 70px; height: 36px; padding: 0 8px; border: 1px solid #DCDFE8; border-radius: 4px; background: #FFFFFF; color: #212121; font-family: 'Roboto', sans-serif; font-size: 14px; line-height: 20px; cursor: pointer; box-sizing: border-box; }
  .pagination__dropdown-btn:focus-visible, .pagination__dropdown-btn--open { outline: none; box-shadow: 0 0 0 3px #CFE3F5; }
  .pagination__dropdown-btn svg { display: block; flex-shrink: 0; }
  .pagination__dropdown-value { line-height: 20px; }
  .pagination__menu { position: absolute; top: calc(100% + 1px); left: 0; min-width: 100%; background: #FFFFFF; border: 1px solid #DCDFE8; border-radius: 0 0 4px 4px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12); padding: 0; margin: 0; list-style: none; z-index: 5; }
  .pagination__menu li { padding: 8px 12px; font-size: 14px; line-height: 20px; color: #55575C; cursor: pointer; white-space: nowrap; }
  .pagination__menu li:hover { background: #F0F1F4; }
  .pagination__menu li[aria-selected='true'] { background: #1A73E8; color: #FFFFFF; }
  .pagination__nav { display: flex; align-items: center; gap: 33px; margin-left: 8px; }
  .pagination__arrow { display: grid; place-items: center; width: 24px; height: 24px; border: none; background: transparent; padding: 0; color: #212121; cursor: pointer; }
  .pagination__arrow svg { display: block; }
  .pagination__arrow:disabled { color: #A1A1A1; cursor: default; }
  .pagination__arrow:not(:disabled):hover { background: #F0F1F4; border-radius: 50%; }
  .pagination__arrow:focus-visible { outline: 2px solid #0061A5; outline-offset: 1px; border-radius: 50%; }

  /* -- OfferDashboard -- */
  /* 2026-08 修正:width 原来是估的 1400px,和 sidebar(260)+content左右
     padding(16+24)+真实核实过的表格内容宽度(1122,来自 Figma Frame
     215286)加起来应该是 1422px 不完全对得上,差了 22px。之前因为
     Update 列是裸 flex:1 吃掉容器剩余空间,这 22px 的误差被它悄悄吸收,
     看不出来;现在其它列也改成比例伸缩后,这个误差会让所有列一起被
     压窄几个百分点,所以顺手把这个数改成算出来的精确值 1422px */
  /* 2026-08 改成 width:100%,始终填满外面新加的 .pg-stage__resize-frame
     (默认 1422px 宽,和之前写死在这里的值一样,所以默认预览不受影响);
     frame 宽度现在由 Controls 面板里的 screenWidth 滑块控制,细节见
     Harness 的 setup() 里 screenWidth/stageFrameStyle 那部分 */
  .offer-dashboard { display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Roboto', sans-serif; width: 100%; }
  /* 2026-08 核实自节点 7448:9826:App Bar→breadcrumb 原为24px(2026-08
     按你的要求改成32px,截图上直接标出来的,不是重新核实的 Figma 数值),
     breadcrumb→Tabs 14px。左边距(292px = sidebar宽260 + 新增左边距16
     + 间距16)现在用 cqw 换算成响应式公式,frame 正好 1422px 宽时算出来
     精确等于 292px;frame 变宽后间距最多长到 100px(2026-08 你说 110px
     还是宽,改成 100px),不会无限变大——这样 breadcrumb 才能跟着
     Buying/Selling/表格一起右移,不会自己停在原地不动。斜率是
     (100-16)/(1900-1422)=84/478≈0.1757,让间距刚好在屏宽到 1900px 时
     就长到 100px 封顶,不是要宽到很多才勉强摸到封顶值 */
  /* 2026-08 按你的要求:breadcrumb 这一行和下面 .offer-dashboard__content
     (Buying/Selling tab + 搜索/筛选 + 表格整块)右侧留 100px 空隙,视口
     右边缘对齐——这两块是分开的 DOM sibling,分别加同一个
     margin-right:100px,等同于套了共同外层容器,不改动各自内部已有的
     padding/gap,也没动 SidebarNav */
  /* 2026-08 按你的要求:sidebar↔主内容区最小间距从16px改成48px——最小值
     (clamp下限)和公式里的基准常数一起从16改成48,屏宽1422px(默认)时
     直接就是48px,不再是16;封顶值仍是100px,新斜率
     (100-48)/(1900-1422)=52/478≈0.1088,保持"屏宽到1900px正好封顶"
     这个规则不变 */
  .offer-dashboard__breadcrumb-row { padding: 32px 0 14px 0; padding-left: calc(276px + clamp(48px, calc(48px + (100cqw - 1422px) * 0.1088), 100px)); margin-right: 100px; }
  .offer-dashboard__body { display: flex; flex: 1; }
  /* 2026-08 按你的要求新增 margin-left:16px,sidebar 不再贴着页面最左边
     ——breadcrumb-row 的 padding-left 基准值(上面那条规则)也跟着从
     276px(=sidebar宽260+间距16)改成 292px,保持对齐关系 */
  .offer-dashboard__body .sidebar-nav { margin-top: -54px; margin-left: 16px; }
  /* 左边距(原来写死16px)同样换算成 cqw 响应式公式,frame 正好1422px时
     精确等于16px,和原来完全一样;变宽后最多长到100px,和 breadcrumb-row
     用的是同一套公式,斜率同样是 0.1757,屏宽到 1900px 封顶 */
  .offer-dashboard__content { flex: 1; min-width: 0; padding: 0 24px 24px 0; padding-left: clamp(48px, calc(48px + (100cqw - 1422px) * 0.1088), 100px); margin-right: 100px; display: flex; flex-direction: column; gap: 0; }
  /* 2026-08 核实自节点 7448:9826:Tabs→搜索框24px,搜索框→筛选chip行16px */
  .offer-dashboard__toolbar { display: flex; flex-direction: column; gap: 16px; padding: 24px 0 0; }
  .offer-dashboard__filters { flex-wrap: wrap; }
  /* 2026-08 按你的要求去掉横线:Figma里筛选chip行到Private Lane行之间
     没有分割线,只有20px纯留白(节点7448:9899 gap-20),之前的border-top
     没有Figma依据,已删掉改成margin-top */
  .offer-dashboard__table-card { margin-top: 20px; }
  /* Private Lane行→表头16px(节点7448:9916 "Table" gap-16) */
  /* 2026-08 你指出 Private Lane/Pagination/切换按钮要一行横向居中对齐:
     行高钉死 min-height:76px(这个文件全局 *{box-sizing:border-box},
     min-height 算的是含 padding 的整个盒子——76px = Pagination 组件
     实际高度60px + padding-bottom16px,不是内容区的60px),table/tile
     两种模式行高一样,align-items:center 统一对所有子元素生效,三者
     居中对齐,行高也不会随模式切换变化,按钮位置不会跳 */
  .offer-dashboard__table-top { display: flex; align-items: center; justify-content: flex-end; min-height: 76px; padding: 0 0 16px; }
  .offer-dashboard__table-top-spacer { flex: 1; display: flex; align-items: center; }
  /* 2026-08 按你的要求新增,参照真实原型 My-ACV--Dealer-filter-main 的 .private-lane/.lane-icon */
  .offer-dashboard__private-lane { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; letter-spacing: 0.4px; color: #545454; }
  .offer-dashboard__private-lane-icon { flex-shrink: 0; }
  .offer-dashboard__viewing-text { flex: 1; font-size: 14px; line-height: 21px; letter-spacing: 0.25px; color: #212121; }
  /* 2026-08 修复切换 table/tile 时按钮位置跳动:table 视图这一行有
     Pagination(比按钮高),tile 视图只有一行文字(比按钮矮),
     align-items:center 会让按钮跟着行高变化上下跳。以 tile 视图(按钮
     本来贴顶部)为基准,给按钮单独 align-self:flex-start,不再跟着行高
     居中 */
  .offer-dashboard__view-toggle { display: flex; align-items: center; }
  .offer-dashboard__view-toggle-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #FFFFFF; border: 1px solid #D1D3D6; border-radius: 0; cursor: pointer; }
  .offer-dashboard__view-toggle-btn:first-child { border-radius: 999px 0 0 999px; }
  .offer-dashboard__view-toggle-btn:last-child { border-left: none; border-radius: 0 999px 999px 0; }
  .offer-dashboard__view-toggle-btn--active { background: #F5F5F5; }
  .offer-dashboard__card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; padding-bottom: 16px; }
  .offer-dashboard__empty { padding: 40px 16px; text-align: center; color: #757575; font-size: 14px; }

  /* -- OfferCard -- */
  .offer-card { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; padding-bottom: 12px; background: #FFFFFF; border: 1px solid #E8E9EB; border-radius: 12px; overflow: hidden; font-family: 'Roboto', sans-serif; box-sizing: border-box; }
  /* 2026-08 按你的要求新增,对照节点 7498:68345 的 V1 hover 按钮。只在
     V1 模式下 hover 才模糊——V2 的按钮也在 .offer-card__info 里面,如果
     不限定 .offer-card--v1,V2 模式 hover 卡片会把它自己一直可见的按钮
     也模糊掉,那是不对的,两个版本是完全独立的交互 */
  /* 2026-08 按 "Offer card — content & interaction spec" 第4节更正:
     1按钮和2按钮的模糊覆盖范围应该一样("identity + status dimmed,
     message stays readable"),之前1按钮只模糊车辆信息,现在也扩大到
     车辆信息+倒计时/状态chip行,和2按钮一致。3按钮(整个info区)不变 */
  .offer-card--v1-btn-1:hover .offer-card__vehicle, .offer-card--v1-btn-1:hover .offer-card__flex-row,
  .offer-card--v1-btn-2:hover .offer-card__vehicle, .offer-card--v1-btn-2:hover .offer-card__flex-row { filter: blur(2px); }
  .offer-card--v1-btn-3:hover .offer-card__info { filter: blur(2px); }
  /* 2026-08 按截图调整位置:不再拉伸铺满+居中,按 Figma 三个按钮数量
     各自核实到的数值定位(top~220px,水平边距~11px),高度由内容撑开 */
  .offer-card__hover-buttons { position: absolute; left: 11px; right: 11px; top: 220px; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 16px; box-sizing: border-box; opacity: 0; visibility: hidden; transition: opacity 0.15s ease; backdrop-filter: blur(2px); }
  .offer-card:hover .offer-card__hover-buttons { opacity: 1; visibility: visible; }

      '<pre>{{ current.notes }}</pre>' +
      '</details>' +
      '</main></div>'
  });

  createApp(Harness).mount('#app');
})();
</script>

<script>
// 只在通过 http:// 本地服务器打开时才轮询检查文件是否被改过(改了就自动
// 刷新页面);直接双击用 file:// 打开时 fetch 会失败,不影响正常使用。
(function () {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  var lastModified = null;
  function checkForUpdate() {
    fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
      .then(function (res) {
        var lm = res.headers.get('Last-Modified');
        if (lastModified === null) { lastModified = lm; return; }
        if (lm && lm !== lastModified) { location.reload(); }
      })
      .catch(function () {});
  }
  setInterval(checkForUpdate, 1500);
})();
</script>
</body>
